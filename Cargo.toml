[workspace]
members = ["crates/capyvault-core", "crates/capyvault-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
fs2 = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = "0.92"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
eframe = { version = "0.33", default-features = false }
rfd = "0.15"
arboard = "3.6"
